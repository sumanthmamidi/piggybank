<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <title>PiggyBank</title>
  <rect width="108" height="108" rx="24" fill="#15171C"/>
  <!-- coin dropping into the slot -->
  <circle cx="50" cy="31" r="7.5" fill="#FFAE57"/>
  <circle cx="50" cy="31" r="4.5" fill="none" stroke="#15171C" stroke-width="1.4"/>
  <!-- tail -->
  <path d="M30,57 c-6,-3 -9,3 -5,6 c3,2 5,-2 2,-3" fill="none" stroke="#FF6F9C" stroke-width="2.6" stroke-linecap="round"/>
  <!-- legs -->
  <path d="M37,70 h7 v10 a2,2 0 0 1 -2,2 h-3 a2,2 0 0 1 -2,-2 Z" fill="#FF6F9C"/>
  <path d="M59,70 h7 v10 a2,2 0 0 1 -2,2 h-3 a2,2 0 0 1 -2,-2 Z" fill="#FF6F9C"/>
  <!-- ear -->
  <path d="M55,46 Q56,34 63,34 Q68,38 69,48 Z" fill="#FF6F9C"/>
  <!-- body -->
  <path d="M28,60 a24,18 0 1,0 48,0 a24,18 0 1,0 -48,0 Z" fill="#FF6F9C"/>
  <!-- snout -->
  <path d="M72,53 h6 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-6 Z" fill="#FF8FB2"/>
  <circle cx="77.5" cy="57.8" r="1.3" fill="#15171C"/>
  <circle cx="77.5" cy="62.2" r="1.3" fill="#15171C"/>
  <!-- eye -->
  <circle cx="66" cy="54" r="2.2" fill="#15171C"/>
  <!-- coin slot -->
  <path d="M44,43.2 h12 a1.6,1.6 0 0 1 0,3.2 h-12 a1.6,1.6 0 0 1 0,-3.2 Z" fill="#15171C"/>
</svg>
