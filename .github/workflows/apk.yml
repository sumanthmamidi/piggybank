# Builds a signed PiggyBank APK (to share) and app bundle (to upload to Google Play) on every push.
# Download them from the run's "Artifacts" section.
name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # versionCode is the commit count

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.PIGGY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::PIGGY_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PIGGY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, privacy checks, build
        env:
          PIGGY_KEYSTORE_PASSWORD: ${{ secrets.PIGGY_KEYSTORE_PASSWORD }}
          PIGGY_KEY_ALIAS: ${{ secrets.PIGGY_KEY_ALIAS }}
          PIGGY_KEY_PASSWORD: ${{ secrets.PIGGY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :shared:jvmTest :androidApp:verifyPermissions :androidApp:verifyNetworkUse :androidApp:assembleRelease :androidApp:bundleRelease

      - name: Name the APK
        run: |
          N=$(git rev-list --count HEAD)
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/PiggyBank-0.4.$N.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "dist/PiggyBank-0.4.$N.aab"
          echo "APK_NAME=PiggyBank-0.4.$N" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            dist/*.apk
            dist/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
